# Конфигурация Nginx для DocScan AI на VPS
# Поместите в /etc/nginx/sites-available/docscan и сделайте симлинк в sites-enabled

server {
    listen 80;
    listen [::]:80;
    server_name scan.yourdomain.com; # Замените на ваш домен или поддомен

    # Редирект на HTTPS (будет настроен certbot автоматически)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name scan.yourdomain.com; # Замените на ваш домен или поддомен

    # SSL пути будут автоматически добавлены certbot
    # ssl_certificate /etc/letsencrypt/live/scan.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/scan.yourdomain.com/privkey.pem;

    # Максимальный размер загружаемого скана/фотографии (50 МБ)
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Поддержка WebSockets для WebRTC Signaling и мгновенного Relay
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Заголовки хоста и реального IP клиента
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты для долгоживущих WebSocket соединений
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_cache_bypass $http_upgrade;
    }
}
